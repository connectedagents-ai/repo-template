# Copy to .github/workflows/ in the PRIVATE agent-home repo. Regenerates every README, memory view and tools/* file on push,
# and opens (or updates) a pull request with them, so the generated files never drift from AGENT.md, memory/sources and
# chairman/ and nothing is pushed straight to main. Allow it once: Settings -> Actions -> "Allow GitHub Actions to create
# and approve pull requests".
name: refresh-agent-home
on:
  push:
    branches: [main]
    paths: ["agents/**/AGENT.md", "memory/sources/**", "chairman/**", "profile/**"]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:  # one refresh at a time; a newer push cancels an older run, so an old run never overwrites a newer refresh
  group: refresh-agent-home
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: connectedagents-ai/repo-template
          path: .tooling
      - run: bash .tooling/ops/agents/refresh.sh --root . --apply --no-sync
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/agent-home-refresh
        run: |
          git config user.name "agent-home-refresh"
          git config user.email "agent-home-refresh@users.noreply.github.com"
          git add -A -- . ':!.tooling'
          if git diff --cached --quiet; then
            echo "nothing to refresh"
            # an open refresh PR from an earlier run is now stale: close it so it can't be merged
            if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
              gh pr close "$BRANCH" --delete-branch --comment "main already matches the generated files; closing."
            fi
            exit 0
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo "main moved on; the newer run publishes"; exit 0; fi
          git switch -c "$BRANCH"
          git commit -m "chore: refresh generated agent-home files"
          git push --force origin "$BRANCH"  # bot-only branch, rebuilt from main on every run
          gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN ||
            gh pr create --base main --head "$BRANCH" --title "chore: refresh generated agent-home files" \
              --body "Regenerated by refresh-agent-home from AGENT.md, memory/sources and chairman/. Review, then merge."
